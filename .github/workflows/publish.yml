name: publish

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
      - name: Build and publish to PyPI
        run: uv build && uv publish
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
