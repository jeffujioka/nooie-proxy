name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Lint
        run: uvx ruff check .
      - name: Tests
        run: uv run python -m unittest discover -s tests -v
