[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nooie-proxy"
version = "0.2.0"
description = "A live MPEG-TS stream from your own Nooie IP camera"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["nooie", "camera", "webrtc", "home-assistant", "go2rtc"]
authors = [{ name = "Louis Goddard", email = "louisgoddard@gmail.com" }]
dependencies = [
    "aiohttp>=3.12,<4",
    "aiortc>=1.14,<2",
    # add_mux_stream, which stream.py needs, arrived in 17.0.0.
    "av>=17,<18",
    "cryptography>=45,<50",
]

[project.scripts]
nooie-proxy = "nooie_proxy.service:main"

[project.urls]
Homepage = "https://github.com/ltrgoddard/nooie-proxy"
Repository = "https://github.com/ltrgoddard/nooie-proxy"
Issues = "https://github.com/ltrgoddard/nooie-proxy/issues"

[tool.hatch.build.targets.wheel]
packages = ["nooie_proxy"]
