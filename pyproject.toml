[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nooie-proxy"
version = "0.2.0"
description = "A live MP4 stream from your own Nooie IP camera"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Louis Goddard", email = "louis@datadesk.eco" }]
dependencies = [
    "aiohttp>=3.12,<4",
    "aiomqtt>=2.5.1,<3",
    "aiortc>=1.14,<2",
    "cryptography>=45,<50",
]

[project.scripts]
nooie-proxy = "nooie_proxy.service:main"

[tool.hatch.build.targets.wheel]
packages = ["nooie_proxy"]
